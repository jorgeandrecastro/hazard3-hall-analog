[package]
edition = "2024"
name = "hazard3-hall-analog"
version = "0.6.0"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async no_std driver for OPEN-SMART linear Hall-effect sensor (RP235x) in the Hazard3 RISC-V ecosystem."
documentation = "https://docs.rs/hazard3-hall-analog"
readme = "README.md"
keywords = [
    "hazard3",
    "hall-effect",
    "magnetic",
    "analog",
    "no-std",
]
categories = [
    "embedded",
    "no-std",
    "hardware-support",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jorgeandrecastro/hazard3-hall-analog"

[lib]
name = "hazard3_hall_analog"
path = "src/lib.rs"

[dependencies]
embassy-rp = { package = "hazard3-rp", version = "0.2" }
embassy-time = { package = "hazard3-time", version = "0.1" }

[features]
default = ["rp235xa"]
rp235xa = ["embassy-rp/rp235xa"]
rp235xb = ["embassy-rp/rp235xb"]

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true